name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Xiangqi.sln
      - name: Build
        run: dotnet build Xiangqi.sln --no-restore
      - name: Test
        run: dotnet test Xiangqi.sln --no-build

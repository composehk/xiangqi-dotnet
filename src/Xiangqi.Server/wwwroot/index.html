<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>象棋擂台 Xiangqi Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="seal" aria-hidden="true">棋</span>
      <div>
        <h1>象棋擂台</h1>
        <p>Xiangqi Arena</p>
      </div>
    </div>
    <span id="conn" class="conn">未连接 Offline</span>
  </header>
  <main>
    <section class="board-card">
      <div id="statusBar" class="status-bar">选择执子颜色和难度。 Choose a color and difficulty.</div>
      <div class="board-wrap">
        <svg id="board" role="img" aria-label="象棋棋盘 Xiangqi board"></svg>
      </div>
      <form id="newGameForm" class="controls">
        <label>
          执子 Color
          <select id="color">
            <option value="red">红 Red</option>
            <option value="black">黑 Black</option>
          </select>
        </label>
        <label>
          难度 Difficulty
          <select id="difficulty">
            <option value="easy">简单 Easy</option>
            <option value="medium" selected>中等 Medium</option>
            <option value="hard">困难 Hard</option>
          </select>
        </label>
        <button id="newGame" type="submit">新对局 New Game</button>
      </form>
      <p id="message" class="message" aria-live="polite">点击己方棋子，再点高亮的落点。 Click a piece, then a highlighted point.</p>
    </section>
    <aside class="lobby">
      <div class="lobby-head">
        <h2>擂台 Lobby</h2>
        <button id="refresh" type="button" class="secondary">刷新 Refresh</button>
      </div>
      <ul id="roomList"></ul>
      <section class="continue" aria-labelledby="contTitle">
        <h2 id="contTitle">断点续弈 Continue</h2>
        <p id="contFee" class="fee">加载中…</p>
        <form id="contLoad" class="cont-form">
          <label>FEN（可选 optional）<input id="contFen" placeholder="rnbakabnr/9/1c5c1/... w - - 0 1" /></label>
          <label>着法 Moves（ICCS 或 中文记谱）<textarea id="contMoves" rows="3" placeholder="1. 炮二平五 马8进7 2. 马二进三 车9平8  或  h2e2 h9g7"></textarea></label>
          <button type="submit" class="secondary">载入回放 Load</button>
        </form>
        <div id="replayNav" class="replay" hidden>
          <div class="nav">
            <button type="button" id="plyFirst" class="secondary">⏮</button>
            <button type="button" id="plyPrev" class="secondary">◀</button>
            <input type="range" id="plySlider" min="0" max="0" value="0" />
            <button type="button" id="plyNext" class="secondary">▶</button>
            <button type="button" id="plyLast" class="secondary">⏭</button>
          </div>
          <p id="plyLabel"></p>
          <div class="cont-opts">
            <label>执子 <select id="contColor"><option value="red">红 Red</option><option value="black">黑 Black</option></select></label>
            <label>难度 <select id="contDifficulty"><option value="easy">简单</option><option value="medium" selected>中等</option><option value="hard">困难</option></select></label>
          </div>
          <button type="button" id="contCreate">从此续下（1 KAS）</button>
        </div>
        <button type="button" id="contResume" class="secondary" hidden>恢复上次续弈 Resume</button>
        <div id="payBox" class="paybox" hidden>
          <p>状态：<b id="payStatus"></b></p>
          <p>签名消息：<code id="payMessage"></code> <button type="button" id="copyMsg" class="secondary small">复制</button></p>
          <p>收款地址：<code id="payTo"></code></p>
          <button type="button" id="kasBtn">KasWare</button>
          <details>
            <summary>手动方式 Manual</summary>
            <div id="authFields">
              <input id="manAddr" placeholder="kaspa:… 地址" />
              <input id="manSig" placeholder="签名 signature (hex / base64)" />
              <button type="button" id="manAuth" class="secondary">提交签名</button>
            </div>
            <div id="txFields">
              <input id="manTx" placeholder="交易 txid" />
              <button type="button" id="manPay" class="secondary">提交 txid</button>
            </div>
          </details>
        </div>
        <p id="contInfo" class="message" aria-live="polite"></p>
      </section>
    </aside>
  </main>
  <noscript>需要启用 JavaScript。 JavaScript is required to play.</noscript>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script src="/app.js"></script>
  <script src="/continue.js"></script>
</body>
</html>
